<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI English Coach</title>

<style>
body {
    font-family: -apple-system;
    margin: 0;
    background: #f5f5f7;
}

/* 首页 */
.home {
    display: flex;
    flex-direction: column;
    height: 100vh;
    justify-content: center;
    padding: 20px;
    gap: 20px;
}

.big-btn {
    padding: 20px;
    font-size: 18px;
    border-radius: 14px;
    border: none;
    background: black;
    color: white;
}

/* 录音页 */
.recording {
    display: none;
    height: 100vh;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.dot {
    font-size: 40px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0% {opacity:1;}
    50% {opacity:0.3;}
    100% {opacity:1;}
}

.stop-btn {
    padding: 15px 30px;
    font-size: 16px;
    border-radius: 12px;
    background: red;
    color: white;
    border: none;
}

/* 对话页 */
.chat {
    display: none;
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

</style>
</head>

<body>

<!-- 首页 -->
<div id="home" class="home">

<h2>AI English Coach</h2>

<button class="big-btn" onclick="startMode('daily')">
🌿 Daily English
</button>

<button class="big-btn" onclick="startMode('work')">
💼 Business English
</button>

</div>

<!-- 录音中 -->
<div id="recording" class="recording">

<div class="dot">🎙 Recording...</div>
<p>Listening to your voice...</p>

<button class="stop-btn" onclick="stopRecording()">
⏹ Stop Recording
</button>

</div>

<!-- 对话 -->
<div id="chat" class="chat">

<h3 id="modeTitle"></h3>

<div class="card">
<b>You said:</b>
<div id="userText"></div>
</div>

<div class="card">
<b>AI Coach:</b>
<div id="aiText"></div>
</div>

<div class="card">
<b>中文翻译:</b>
<div id="zhText"></div>
</div>

<button class="big-btn" onclick="backHome()">返回首页</button>

</div>

<script>

const API_KEY = "你的DeepSeek API Key";

let mode = "daily";
let recognition;

// ===== 进入模式 =====
function startMode(m) {
    mode = m;

    document.getElementById("home").style.display = "none";
    document.getElementById("recording").style.display = "flex";

    startRecording();
}

// ===== 开始录音 =====
function startRecording() {

    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";
    recognition.start();

    recognition.onresult = function(e) {
        let text = e.results[0][0].transcript;

        document.getElementById("userText").innerText = text;

        stopRecording();
        sendToAI(text);
    };
}

// ===== 停止录音 =====
function stopRecording() {
    if (recognition) recognition.stop();

    document.getElementById("recording").style.display = "none";
    document.getElementById("chat").style.display = "block";

    document.getElementById("modeTitle").innerText =
        mode === "daily" ? "🌿 Daily English" : "💼 Business English";
}

// ===== 返回 =====
function backHome() {
    document.getElementById("chat").style.display = "none";
    document.getElementById("home").style.display = "flex";
}

// ===== AI =====
async function sendToAI(text) {

    let prompt =
        mode === "daily"
        ? "You are a friendly American. Correct and reply naturally: " + text
        : "You are a business English coach. Improve this: " + text;

    const res = await fetch("https://api.deepseek.com/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + API_KEY
        },
        body: JSON.stringify({
            model: "deepseek-chat",
            messages: [{ role: "user", content: prompt }]
        })
    });

    const data = await res.json();
    const reply = data.choices[0].message.content;

    document.getElementById("aiText").innerText = reply;

    speak(reply);

    translate(text, reply);
}

// ===== 翻译 =====
async function translate(en, ai) {

    const res = await fetch("https://api.deepseek.com/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + API_KEY
        },
        body: JSON.stringify({
            model: "deepseek-chat",
            messages: [{
                role: "user",
                content: `Translate to Chinese:\nUser:${en}\nAI:${ai}`
            }]
        })
    });

    const data = await res.json();

    document.getElementById("zhText").innerText =
        data.choices[0].message.content;
}

// ===== 语音播放 =====
function speak(text) {
    let s = new SpeechSynthesisUtterance(text);
    s.lang = "en-US";
    speechSynthesis.speak(s);
}

</script>

</body>
</html>
