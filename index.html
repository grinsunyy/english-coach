<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 口语教练 · Speak Learn Grow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  :root{
    --bg:#08081a;
    --bg2:#0f0f24;
    --card:#16162e;
    --card-hover:#1d1d3a;
    --accent:#7c6ef7;
    --accent2:#4ecdc4;
    --accent3:#ffb86e;
    --pink:#ff6b9d;
    --text:#f5f5fb;
    --muted:#8a8aaa;
    --muted2:#5a5a78;
    --border:rgba(255,255,255,0.08);
    --border-bright:rgba(255,255,255,0.15);
    --radius:20px;
    --radius-sm:14px;
    --font:'Plus Jakarta Sans','Noto Sans SC',-apple-system,sans-serif;
  }
  body{
    font-family:var(--font);
    background:radial-gradient(ellipse at top,#1a1a3a 0%,var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* AMBIENT GLOW */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(600px circle at 10% 20%, rgba(124,110,247,0.15), transparent 50%),
      radial-gradient(500px circle at 90% 80%, rgba(78,205,196,0.1), transparent 50%);
  }

  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh}

  /* SCREENS */
  .screen{display:none;flex-direction:column;padding:28px 22px 32px;min-height:100vh;animation:slideIn 0.45s cubic-bezier(.2,.9,.3,1.2)}
  .screen.active{display:flex}
  @keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  /* HEADER */
  .top-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .back-btn{
    background:var(--card);border:1px solid var(--border);
    width:48px;height:48px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all 0.2s;flex-shrink:0;
    font-size:20px;color:var(--text);
  }
  .back-btn:hover{border-color:var(--accent);background:var(--card-hover);transform:translateX(-2px)}
  .back-btn:active{transform:scale(0.95)}
  .top-title{font-size:18px;font-weight:700;flex:1;letter-spacing:-0.3px}
  .top-meta{font-size:12px;color:var(--muted);padding:6px 12px;background:var(--card);border-radius:50px;border:1px solid var(--border)}

  /* HOME */
  .hero{text-align:center;padding:32px 0 36px}
  .hero-icon{
    width:88px;height:88px;margin:0 auto 18px;
    background:linear-gradient(135deg,#7c6ef7 0%,#4ecdc4 100%);
    border-radius:26px;
    display:flex;align-items:center;justify-content:center;
    font-size:44px;
    box-shadow:0 20px 50px rgba(124,110,247,0.45),0 0 0 1px rgba(255,255,255,0.1) inset;
    transform:rotate(-6deg);
    animation:float 4s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-6px)}}
  .hero-title{
    font-size:34px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,#fff,#a8a4ff);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;margin-bottom:6px;
  }
  .hero-sub{font-size:12px;color:var(--muted);letter-spacing:4px;font-weight:500}

  .section-label{
    font-size:11px;color:var(--muted);letter-spacing:2px;
    margin:8px 4px 14px;text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent)}

  /* LANGUAGE GRID */
  .lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .lang-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    padding:22px 14px;
    text-align:center;
    cursor:pointer;
    transition:all 0.25s cubic-bezier(.2,.9,.3,1.2);
    position:relative;overflow:hidden;
    min-height:118px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .lang-card::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(124,110,247,0.18),rgba(78,205,196,0.05));
    opacity:0;transition:opacity 0.3s;
  }
  .lang-card:hover::before{opacity:1}
  .lang-card:hover{border-color:rgba(124,110,247,0.5);transform:translateY(-3px)}
  .lang-card:active{transform:scale(0.97)}
  .lang-flag{font-size:38px;display:block;margin-bottom:10px;line-height:1;position:relative;z-index:1}
  .lang-name{font-size:16px;font-weight:700;display:block;position:relative;z-index:1}
  .lang-sub{font-size:12px;color:var(--muted);display:block;margin-top:3px;position:relative;z-index:1;font-weight:500}

  /* SCENE CARDS (English path) */
  .scene-list{display:flex;flex-direction:column;gap:14px}
  .scene-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    padding:24px 22px;
    cursor:pointer;
    transition:all 0.25s cubic-bezier(.2,.9,.3,1.2);
    display:flex;align-items:center;gap:18px;
    position:relative;overflow:hidden;
    min-height:96px;
  }
  .scene-card::after{
    content:'→';position:absolute;right:22px;top:50%;
    transform:translateY(-50%);
    font-size:20px;color:var(--muted);transition:all 0.25s;
  }
  .scene-card:hover{border-color:rgba(124,110,247,0.5);background:var(--card-hover);transform:translateX(4px)}
  .scene-card:hover::after{color:var(--accent2);right:18px}
  .scene-card:active{transform:scale(0.98)}
  .scene-icon{
    width:60px;height:60px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;flex-shrink:0;
    background:linear-gradient(135deg,rgba(124,110,247,0.2),rgba(78,205,196,0.1));
    border:1px solid rgba(124,110,247,0.25);
  }
  .scene-card:nth-child(2) .scene-icon{background:linear-gradient(135deg,rgba(255,184,110,0.2),rgba(255,107,157,0.1));border-color:rgba(255,184,110,0.25)}
  .scene-card:nth-child(3) .scene-icon{background:linear-gradient(135deg,rgba(78,205,196,0.2),rgba(124,110,247,0.1));border-color:rgba(78,205,196,0.25)}
  .scene-card:nth-child(4) .scene-icon{background:linear-gradient(135deg,rgba(255,107,157,0.2),rgba(124,110,247,0.1));border-color:rgba(255,107,157,0.25)}
  .scene-info{flex:1;padding-right:24px}
  .scene-name{font-size:17px;font-weight:700;display:block;margin-bottom:4px;letter-spacing:-0.2px}
  .scene-desc{font-size:13px;color:var(--muted);line-height:1.5}

  /* DIFFICULTY */
  .difficulty-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px}
  .diff-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    padding:20px 18px;cursor:pointer;
    transition:all 0.2s;display:flex;align-items:center;gap:14px;
    position:relative;
  }
  .diff-card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .diff-card:active{transform:scale(0.98)}
  .diff-dots{display:flex;gap:4px;flex-shrink:0}
  .diff-dot{width:10px;height:10px;border-radius:50%;background:var(--border-bright)}
  .diff-dot.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .diff-info{flex:1}
  .diff-name{font-size:15px;font-weight:700;display:block;margin-bottom:2px}
  .diff-desc{font-size:12px;color:var(--muted)}

  /* BASIC LEARNING (non-English) */
  .module-list{display:flex;flex-direction:column;gap:14px}
  .module-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    padding:22px;cursor:pointer;
    transition:all 0.25s;display:flex;align-items:center;gap:16px;
    position:relative;overflow:hidden;
  }
  .module-card:hover{border-color:rgba(124,110,247,0.5);transform:translateX(4px)}
  .module-card:active{transform:scale(0.98)}
  .module-icon{
    width:54px;height:54px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;flex-shrink:0;
  }
  .module-info{flex:1}
  .module-name{font-size:16px;font-weight:700;display:block;margin-bottom:3px}
  .module-desc{font-size:12px;color:var(--muted);line-height:1.4}
  .module-arrow{font-size:18px;color:var(--muted2)}

  /* LEARN CONTENT (alphabet/grammar/phrases) */
  .learn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin-top:12px}
  .alpha-cell{
    background:var(--card);border:1.5px solid var(--border);
    border-radius:var(--radius-sm);padding:14px 8px;
    text-align:center;cursor:pointer;transition:all 0.2s;
    min-height:88px;display:flex;flex-direction:column;justify-content:center;
  }
  .alpha-cell:hover{border-color:var(--accent);background:var(--card-hover);transform:translateY(-2px)}
  .alpha-cell:active{transform:scale(0.94)}
  .alpha-letter{font-size:22px;font-weight:700;margin-bottom:4px;line-height:1}
  .alpha-pron{font-size:11px;color:var(--accent2);font-weight:600}
  .alpha-zh{font-size:10px;color:var(--muted);margin-top:2px}

  .phrase-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .phrase-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:16px 18px;
    cursor:pointer;transition:all 0.2s;
    display:flex;align-items:center;gap:14px;
  }
  .phrase-card:hover{border-color:var(--accent);background:var(--card-hover)}
  .phrase-text{flex:1}
  .phrase-target{font-size:16px;font-weight:600;margin-bottom:3px}
  .phrase-zh{font-size:13px;color:var(--muted)}
  .phrase-play{
    width:40px;height:40px;border-radius:50%;
    background:rgba(124,110,247,0.15);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);font-size:14px;flex-shrink:0;
    transition:all 0.2s;
  }
  .phrase-card:hover .phrase-play{background:var(--accent);color:#fff}

  .grammar-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:18px 20px;
    margin-bottom:12px;
  }
  .grammar-title{font-size:15px;font-weight:700;color:var(--accent2);margin-bottom:8px}
  .grammar-body{font-size:13px;line-height:1.7;color:var(--text)}
  .grammar-example{
    background:rgba(124,110,247,0.08);border-left:3px solid var(--accent);
    padding:10px 14px;border-radius:8px;margin-top:10px;font-size:13px;
  }
  .grammar-example .ex-zh{color:var(--muted);font-size:12px;margin-top:4px}

  /* CONVERSATION */
  .chat-screen{padding:0;display:none;flex-direction:column;height:100vh;background:var(--bg)}
  .chat-screen.active{display:flex}
  .chat-header{
    padding:20px 22px 16px;
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:12px;
    background:var(--bg2);
    backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:10;
  }
  .chat-info{flex:1}
  .chat-title{font-size:15px;font-weight:700;letter-spacing:-0.2px}
  .chat-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
  .live-dot{width:6px;height:6px;border-radius:50%;background:#4ecdc4;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}

  .chat-messages{
    flex:1;overflow-y:auto;padding:18px 18px 12px;
    display:flex;flex-direction:column-reverse;
    gap:14px;
  }
  .msg{
    max-width:88%;animation:msgIn 0.4s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes msgIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{align-self:flex-end}
  .msg.ai{align-self:flex-start}
  .msg-bubble{
    padding:14px 18px;border-radius:20px;
    font-size:15px;line-height:1.5;
    word-wrap:break-word;
  }
  .msg.user .msg-bubble{
    background:linear-gradient(135deg,#7c6ef7,#9d8ff8);
    color:#fff;border-bottom-right-radius:6px;
  }
  .msg.ai .msg-bubble{
    background:var(--card);
    border:1px solid var(--border);
    border-bottom-left-radius:6px;
  }
  .msg-zh{
    font-size:12px;color:var(--muted);
    margin-top:6px;padding:0 6px;line-height:1.5;
  }
  .msg-tools{
    display:flex;gap:8px;margin-top:8px;padding:0 4px;
  }
  .msg-tool-btn{
    background:var(--card);border:1px solid var(--border);
    border-radius:50px;padding:6px 12px;font-size:11px;
    color:var(--muted);cursor:pointer;transition:all 0.2s;
    display:inline-flex;align-items:center;gap:5px;
    font-family:inherit;
  }
  .msg-tool-btn:hover{border-color:var(--accent);color:var(--text);background:var(--card-hover)}

  /* CORRECTION */
  .correction{
    background:linear-gradient(135deg,rgba(255,184,110,0.12),rgba(255,107,157,0.06));
    border:1px solid rgba(255,184,110,0.3);
    border-radius:16px;padding:14px 16px;
    margin-bottom:8px;
    align-self:flex-end;max-width:88%;
  }
  .correction-label{
    font-size:11px;color:var(--accent3);font-weight:700;
    letter-spacing:1px;margin-bottom:6px;
    display:flex;align-items:center;gap:6px;
  }
  .correction-text{font-size:14px;line-height:1.5;color:var(--text)}
  .correction-text del{color:var(--muted);text-decoration:line-through}
  .correction-text ins{color:#4ecdc4;text-decoration:none;font-weight:600;background:rgba(78,205,196,0.1);padding:1px 4px;border-radius:4px}
  .correction-explain{
    font-size:12px;color:var(--muted);margin-top:8px;
    padding-top:8px;border-top:1px dashed rgba(255,255,255,0.1);
    line-height:1.5;
  }

  /* TYPING INDICATOR */
  .typing{align-self:flex-start;display:flex;gap:5px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:20px;border-bottom-left-radius:6px}
  .typing-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:typing 1.4s infinite}
  .typing-dot:nth-child(2){animation-delay:0.2s}
  .typing-dot:nth-child(3){animation-delay:0.4s}
  @keyframes typing{0%,60%,100%{transform:translateY(0);opacity:0.5}30%{transform:translateY(-6px);opacity:1}}

  /* INPUT BAR */
  .chat-input{
    padding:14px 16px 18px;
    background:var(--bg2);
    border-top:1px solid var(--border);
    display:flex;gap:10px;align-items:flex-end;
  }
  .input-wrap{
    flex:1;background:var(--card);
    border:1.5px solid var(--border);
    border-radius:24px;padding:4px 4px 4px 18px;
    display:flex;align-items:center;gap:6px;
    transition:all 0.2s;
  }
  .input-wrap:focus-within{border-color:var(--accent)}
  .text-input{
    flex:1;background:transparent;border:none;outline:none;
    color:var(--text);font-size:15px;padding:12px 0;
    font-family:inherit;resize:none;max-height:100px;line-height:1.4;
  }
  .text-input::placeholder{color:var(--muted2)}
  .send-btn{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(135deg,#7c6ef7,#4ecdc4);
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:18px;transition:all 0.2s;
    flex-shrink:0;
  }
  .send-btn:disabled{opacity:0.4;cursor:not-allowed}
  .send-btn:hover:not(:disabled){transform:scale(1.05)}
  .send-btn:active:not(:disabled){transform:scale(0.92)}

  .mic-btn{
    width:54px;height:54px;border-radius:50%;
    background:linear-gradient(135deg,#7c6ef7,#9d8ff8);
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:22px;transition:all 0.2s;
    flex-shrink:0;
    box-shadow:0 6px 20px rgba(124,110,247,0.4);
  }
  .mic-btn:hover{transform:scale(1.06)}
  .mic-btn:active{transform:scale(0.94)}
  .mic-btn.recording{
    background:linear-gradient(135deg,#ff6b6b,#ff6b9d);
    animation:micPulse 1.2s ease-in-out infinite;
  }
  @keyframes micPulse{0%,100%{box-shadow:0 6px 20px rgba(255,107,107,0.4),0 0 0 0 rgba(255,107,107,0.5)}50%{box-shadow:0 6px 20px rgba(255,107,107,0.6),0 0 0 14px rgba(255,107,107,0)}}

  /* CHAT EMPTY STATE */
  .chat-empty{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;padding:30px;color:var(--muted);
  }
  .chat-empty-icon{font-size:54px;margin-bottom:16px;opacity:0.6}
  .chat-empty-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px}
  .chat-empty-desc{font-size:13px;line-height:1.6;max-width:280px}

  /* UTILITY */
  .scrollable::-webkit-scrollbar{width:0}
  .start-btn{
    width:100%;padding:18px;
    background:linear-gradient(135deg,#7c6ef7,#4ecdc4);
    border:none;border-radius:var(--radius);
    color:#fff;font-size:16px;font-weight:700;
    cursor:pointer;margin-top:24px;
    transition:all 0.2s;letter-spacing:0.3px;
    box-shadow:0 10px 30px rgba(124,110,247,0.35);
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(124,110,247,0.5)}
  .start-btn:active{transform:scale(0.98)}

  .api-warn{
    background:linear-gradient(135deg,rgba(255,184,110,0.12),rgba(255,107,107,0.06));
    border:1px solid rgba(255,184,110,0.3);
    border-radius:14px;padding:12px 16px;
    font-size:12px;color:var(--accent3);
    margin:0 18px 12px;line-height:1.5;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ========== HOME ========== -->
  <div class="screen active" id="screen-home">
    <div class="hero">
      <div class="hero-icon">🎓</div>
      <div class="hero-title">AI 口语教练</div>
      <div class="hero-sub">SPEAK · LEARN · GROW</div>
    </div>
    <div class="section-label">选择练习语言 · Choose Language</div>
    <div class="lang-grid" id="lang-grid"></div>
  </div>

  <!-- ========== ENGLISH SCENES ========== -->
  <div class="screen" id="screen-en-scenes">
    <div class="top-bar">
      <button class="back-btn" data-back="home">←</button>
      <div class="top-title">英语 · English</div>
      <div class="top-meta">🇺🇸</div>
    </div>
    <div class="section-label">选择练习场景</div>
    <div class="scene-list" id="en-scene-list"></div>
  </div>

  <!-- ========== DIFFICULTY ========== -->
  <div class="screen" id="screen-difficulty">
    <div class="top-bar">
      <button class="back-btn" data-back="auto">←</button>
      <div class="top-title" id="diff-title">选择难度</div>
    </div>
    <div class="section-label">选择难度等级 · Difficulty</div>
    <div class="difficulty-grid" id="diff-grid"></div>
  </div>

  <!-- ========== NON-ENGLISH HUB ========== -->
  <div class="screen" id="screen-basic-hub">
    <div class="top-bar">
      <button class="back-btn" data-back="home">←</button>
      <div class="top-title" id="basic-hub-title">基础学习</div>
      <div class="top-meta" id="basic-hub-flag">🌐</div>
    </div>
    <div class="section-label">学习模块 · Modules</div>
    <div class="module-list" id="module-list"></div>
  </div>

  <!-- ========== ALPHABET ========== -->
  <div class="screen" id="screen-alphabet">
    <div class="top-bar">
      <button class="back-btn" data-back="basic">←</button>
      <div class="top-title">字母与发音</div>
    </div>
    <div class="section-label" id="alpha-section-label">点击字母听发音</div>
    <div class="learn-grid" id="alpha-grid"></div>
  </div>

  <!-- ========== GRAMMAR ========== -->
  <div class="screen" id="screen-grammar">
    <div class="top-bar">
      <button class="back-btn" data-back="basic">←</button>
      <div class="top-title">语法基础</div>
    </div>
    <div class="section-label">基础语法要点</div>
    <div id="grammar-content"></div>
  </div>

  <!-- ========== PHRASES ========== -->
  <div class="screen" id="screen-phrases">
    <div class="top-bar">

// ============================================================
// NAV
// ============================================================
function show(id){
  // Stop any audio whenever we leave chat
  document.querySelectorAll('.screen,.chat-screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  if(id!=='chat'){
    stopSpeech();
    stopRecognition();
  }
  window.scrollTo(0,0);
}

function backTo(target){
  if(target==='auto'){
    // From difficulty back: english -> en-scenes; non-english -> basic-hub
    if(state.lang && state.lang.id==='en') show('en-scenes');
    else show('basic-hub');
    return;
  }
  if(target==='basic') show('basic-hub');
  else if(target==='home'){state.lang=null;show('home');}
  else show(target);
}

document.querySelectorAll('[data-back]').forEach(b=>{
  b.addEventListener('click',()=>backTo(b.dataset.back));
});

// ============================================================
// HOME RENDER
// ============================================================
function renderHome(){
  const grid=document.getElementById('lang-grid');
  grid.innerHTML='';
  LANGS.forEach(L=>{
    const card=document.createElement('div');
    card.className='lang-card';
    card.innerHTML=`
      <span class="lang-flag">${L.flag}</span>
      <span class="lang-name">${L.name}</span>
      <span class="lang-sub">${L.native}</span>`;
    card.addEventListener('click',()=>{
      state.lang=L;
      if(L.id==='en') {renderEnScenes();show('en-scenes');}
      else {renderBasicHub();show('basic-hub');}
    });
    grid.appendChild(card);
  });
}

// ============================================================
// ENGLISH SCENES
// ============================================================
function renderEnScenes(){
  const list=document.getElementById('en-scene-list');
  list.innerHTML='';
  SCENES.forEach(S=>{
    const c=document.createElement('div');
    c.className='scene-card';
    c.innerHTML=`
      <div class="scene-icon">${S.icon}</div>
      <div class="scene-info">
        <span class="scene-name">${S.name}</span>
        <span class="scene-desc">${S.desc}</span>
      </div>`;
    c.addEventListener('click',()=>{
      state.scene=S;
      renderDifficulty();show('difficulty');
    });
    list.appendChild(c);
  });
}

// ============================================================
// DIFFICULTY
// ============================================================
function renderDifficulty(){
  document.getElementById('diff-title').textContent=`${state.lang.name} · ${state.scene.name}`;
  const grid=document.getElementById('diff-grid');
  grid.innerHTML='';
  DIFFICULTIES.forEach(D=>{
    const c=document.createElement('div');
    c.className='diff-card';
    let dots='';
    for(let i=0;i<3;i++) dots+=`<span class="diff-dot ${i<D.dots?'on':''}"></span>`;
    c.innerHTML=`
      <div class="diff-dots">${dots}</div>
      <div class="diff-info">
        <span class="diff-name">${D.name}</span>
        <span class="diff-desc">${D.desc}</span>
      </div>`;
    c.addEventListener('click',()=>{
      state.diff=D;
      startChat();
    });
    grid.appendChild(c);
  });
}

// ============================================================
// BASIC HUB (non-English)
// ============================================================
function renderBasicHub(){
  document.getElementById('basic-hub-title').textContent=`${state.lang.name} · ${state.lang.native}`;
  document.getElementById('basic-hub-flag').textContent=state.lang.flag;
  const list=document.getElementById('module-list');
  list.innerHTML='';
  MODULES.forEach(M=>{
    const c=document.createElement('div');
    c.className='module-card';
    c.innerHTML=`
      <div class="module-icon" style="background:${M.color}">${M.icon}</div>
      <div class="module-info">
        <span class="module-name">${M.name}</span>
        <span class="module-desc">${M.desc}</span>
      </div>
      <span class="module-arrow">→</span>`;
    c.addEventListener('click',()=>{
      if(M.id==='alphabet'){renderAlphabet();show('alphabet');}
      else if(M.id==='grammar'){renderGrammar();show('grammar');}
      else if(M.id==='phrases'){renderPhrases();show('phrases');}
      else if(M.id==='advanced'){renderEnScenes();show('en-scenes');}
    });
    list.appendChild(c);
  });
}

function renderAlphabet(){
  const grid=document.getElementById('alpha-grid');
  grid.innerHTML='';
  const data=ALPHABETS[state.lang.id]||[];
  data.forEach(A=>{
    const c=document.createElement('div');
    c.className='alpha-cell';
    c.innerHTML=`
      <span class="alpha-letter">${A.l}</span>
      <span class="alpha-pron">${A.p}</span>
      <span class="alpha-zh">${A.z}</span>`;
    c.addEventListener('click',()=>{
      const txt=A.l.split(' ')[0];
      speak(txt,state.lang.code);
    });
    grid.appendChild(c);
  });
}

  data.forEach(P=>{
    const c=document.createElement('div');
    c.className='phrase-card';
    c.innerHTML=`
      <div class="phrase-text">
        <div class="phrase-target">${P.t}</div>
        <div class="phrase-zh">${P.z}</div>
      </div>
      <div class="phrase-play">▶</div>`;
    c.addEventListener('click',()=>speak(P.t,state.lang.code));
    list.appendChild(c);
  });
}

// ============================================================
// CHAT
// ============================================================
function startChat(){
  state.history=[];
  document.getElementById('chat-title').textContent=`${state.lang.name} · ${state.scene.name} · ${state.diff.name}`;
  document.getElementById('chat-sub-text').textContent='AI 教练在线 · 会先纠错再回应';
  renderMessages();
  show('chat');
  // Send AI greeting
  setTimeout(()=>aiOpening(),300);
}

document.getElementById('chat-back').addEventListener('click',()=>{
  stopSpeech();
  stopRecognition();
  // Back goes to difficulty (or scenes for non-en advanced)
  show('difficulty');
});

function renderMessages(){
  const box=document.getElementById('chat-messages');
  box.innerHTML='';
  if(state.history.length===0){
    box.innerHTML=`<div class="chat-empty"><div class="chat-empty-icon">💬</div><div class="chat-empty-title">开始对话吧</div><div class="chat-empty-desc">点击下方麦克风录音，或直接输入文字。AI 会先纠正你的错误，再继续聊天。</div></div>`;
    return;
  }
  // column-reverse: append in chronological order, newest renders at top
  state.history.forEach(m=>{
    const el=buildMsgEl(m);
    box.appendChild(el);
  });
}

function buildMsgEl(m){
  if(m.role==='correction'){
    const d=document.createElement('div');
    d.className='correction';
    d.innerHTML=`
      <div class="correction-label">✨ 口语纠错</div>
      <div class="correction-text">${m.html}</div>
      <div class="correction-explain">${m.explain||''}</div>`;
    return d;
  }
  if(m.role==='typing'){
    const d=document.createElement('div');
    d.className='typing';
    d.innerHTML=`<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>`;
    return d;
  }
  const d=document.createElement('div');
  d.className='msg '+(m.role==='user'?'user':'ai');
  let zh=m.zh?`<div class="msg-zh">${m.zh}</div>`:'';
  let tools='';
  if(m.role==='ai' && m.content){
    tools=`<div class="msg-tools">
      <button class="msg-tool-btn" data-speak="${encodeURIComponent(m.content)}">🔊 播放</button>
    </div>`;
  }
  d.innerHTML=`<div class="msg-bubble">${escapeHtml(m.content)}</div>${zh}${tools}`;
  return d;
}

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// Speak buttons (event delegation)
document.getElementById('chat-messages').addEventListener('click',e=>{
  const b=e.target.closest('[data-speak]');
  if(b){speak(decodeURIComponent(b.dataset.speak),state.lang.code);}
});

function pushAndRender(item){
  state.history.push(item);
  // Re-render
  const box=document.getElementById('chat-messages');
  // Remove empty state
  const empty=box.querySelector('.chat-empty');
  if(empty)empty.remove();
  // append new node
  const el=buildMsgEl(item);
  box.appendChild(el);
}

function removeTyping(){
  const box=document.getElementById('chat-messages');
  // Find last typing in DOM and the matching state entry
  state.history=state.history.filter(m=>m.role!=='typing');
  const t=box.querySelector('.typing');
  if(t)t.remove();
}

// ============================================================
// AI CALL via Anthropic API
// ============================================================
async function callAI(userMsg, isOpening=false){
  const sysPrompt = buildSystemPrompt(isOpening);
  const messages = [];
  // Build conversation history (excluding corrections/typings)
  state.history.filter(m=>m.role==='user'||m.role==='ai').forEach(m=>{
    messages.push({role:m.role==='ai'?'assistant':'user',content:m.role==='ai'?(m.raw||JSON.stringify({reply:m.content,translation:m.zh,hasError:false})):m.content});
  });
  if(userMsg) messages.push({role:'user',content:userMsg});
  if(isOpening && messages.length===0){
    messages.push({role:'user',content:'<开场白请求>请用'+state.lang.native+'说一句开场问候，引出场景对话主题。'});
  }

  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        system:sysPrompt,
        messages
      })
    });
    const data=await r.json();
    const txt=(data.content||[]).map(c=>c.text||'').join('').trim();
    // Strip code fences
    const clean=txt.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
    return JSON.parse(clean);
  }catch(e){
    console.error(e);
    return {hasError:false,reply:'(网络错误，请稍后再试)',translation:'',raw:''};
  }
}

function buildSystemPrompt(isOpening){
  const L=state.lang, S=state.scene, D=state.diff;
  return `你是一位专业的${L.name}（${L.native}）口语教练。学习者母语是中文。

【场景】${S.name}（${S.desc}）
【难度】${D.name} - ${D.desc}
${S.id==='deep'?'本场景为深度沟通：可使用学科专有名词、社会现象、抽象概念。但要点拨学习者，让其能跟上。':''}
${S.id==='business'?'本场景为商务职场：用语正式、专业，涉及会议、邮件、谈判等。':''}
${S.id==='daily'?'本场景为日常对话：自然、口语化、贴近真实生活。':''}

【核心规则】
1. 如果学习者的输入有语法、用词或表达错误，必须先纠正再回应。纠正时给出原句和正确句的对比，并用一句中文简要解释。
2. 始终用 ${L.native} 自然地回应，并附上完整中文翻译。
3. 难度匹配：${D.id==='easy'?'用最简单的词汇和短句，速度慢。':D.id==='mid'?'用日常常用表达。':'用地道、复杂、自然的表达。'}
4. 每次回复保持 1-3 句话，自然地推进对话或反问。
5. 如果用户用中文输入，先鼓励其尝试用 ${L.native}，并给出建议表达，然后用 ${L.native} 继续。

【输出格式】只输出一个 JSON 对象（不要 markdown，不要其它文字）。结构：

无错误时：
{"hasError":false,"reply":"<${L.native} 回复>","translation":"<中文翻译>"}

有错误时：
{"hasError":true,"correctionOriginal":"<用户原句>","correctionFixed":"<纠正后的句子>","explanation":"<一句中文解释错误点>","reply":"<${L.native} 回复>","translation":"<中文翻译>"}

只输出 JSON，不要任何额外说明。`;
}

async function aiOpening(){
  const typing={role:'typing'};
  pushAndRender(typing);
  const res=await callAI('',true);
  removeTyping();
  const aiMsg={
    role:'ai',
    content:res.reply||'',
    zh:res.translation||'',
    raw:JSON.stringify(res)
  };
  pushAndRender(aiMsg);
  speak(aiMsg.content,state.lang.code);
}

async function sendUserMessage(text){
  if(!text||!text.trim())return;
  text=text.trim();

  // 1. push user msg
  const userMsg={role:'user',content:text};
  pushAndRender(userMsg);

  // 2. typing indicator
  pushAndRender({role:'typing'});

  // 3. call AI
  const res=await callAI(text);
  removeTyping();

  // 4. correction first if exists
  if(res.hasError && res.correctionFixed){
    const original=escapeHtml(res.correctionOriginal||text);
    const fixed=escapeHtml(res.correctionFixed);
    pushAndRender({
      role:'correction',
      html:`<del>${original}</del><br><ins>${fixed}</ins>`,
      explain:escapeHtml(res.explanation||'')
    });
  }

  // 5. AI reply
  const aiMsg={
    role:'ai',
    content:res.reply||'',
    zh:res.translation||'',
    raw:JSON.stringify(res)
  };
  pushAndRender(aiMsg);
  speak(aiMsg.content,state.lang.code);
}

// ============================================================
// INPUT HANDLING
// ============================================================
const ti=document.getElementById('text-input');
const sendBtn=document.getElementById('send-btn');

ti.addEventListener('input',()=>{
  ti.style.height='auto';
  ti.style.height=Math.min(ti.scrollHeight,100)+'px';
});

ti.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});

sendBtn.addEventListener('click',handleSend);

function handleSend(){
  const v=ti.value.trim();
  if(!v)return;
  ti.value='';
  ti.style.height='auto';
  sendUserMessage(v);
}

// ============================================================
// SPEECH SYNTHESIS (TTS)
// ============================================================
let currentUtter=null;
function speak(text,langCode){
  if(!('speechSynthesis' in window))return;
  stopSpeech();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=langCode||'en-US';
  u.rate=state.diff && state.diff.id==='easy'?0.85:state.diff && state.diff.id==='hard'?1.05:0.95;
  currentUtter=u;
  // Pick a matching voice if available
  const voices=window.speechSynthesis.getVoices();
  const v=voices.find(v=>v.lang===langCode)||voices.find(v=>v.lang.startsWith(langCode.split('-')[0]));
  if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}
function stopSpeech(){
  if('speechSynthesis' in window){window.speechSynthesis.cancel();}
  currentUtter=null;
}

// Reload voices when ready
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged=()=>{};
}

// ============================================================
// SPEECH RECOGNITION (STT)
// ============================================================
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
const micBtn=document.getElementById('mic-btn');

micBtn.addEventListener('click',()=>{
  if(!SR){
    alert('当前浏览器不支持语音识别。请用 Chrome 或 Safari，或直接输入文字。');
    return;
  }
  if(state.recognizing){
    stopRecognition();
    return;
  }
  startRecognition();
});

function startRecognition(){
  if(!SR)return;
  stopSpeech();
  rec=new SR();
  rec.lang=state.lang.code;
  rec.continuous=false;
  rec.interimResults=true;
  rec.onstart=()=>{state.recognizing=true;micBtn.classList.add('recording');};
  rec.onresult=(e)=>{
    let txt='';
    for(const r of e.results) txt+=r[0].transcript;
    ti.value=txt;
  };
  rec.onerror=(e)=>{console.error('SR error',e);state.recognizing=false;micBtn.classList.remove('recording');};
  rec.onend=()=>{
    state.recognizing=false;
    micBtn.classList.remove('recording');
    const v=ti.value.trim();
    if(v){
      ti.value='';
      sendUserMessage(v);
    }
  };
  try{rec.start();}catch(e){console.error(e);}
}

function stopRecognition(){
  if(rec){try{rec.stop();}catch(e){}}
  state.recognizing=false;
  micBtn.classList.remove('recording');
}

// Stop everything when page hides
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopSpeech();stopRecognition();}
});
window.addEventListener('beforeunload',()=>{stopSpeech();stopRecognition();});

// ============================================================
// INIT
// ============================================================
renderHome();
</script>
