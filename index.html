<!DOCTYPE html>

<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 口语教练</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #0f0f1a;
–card: #1a1a2e;
–border: #2a2a45;
–gold: #f0c040;
–blue: #4a9eff;
–green: #3ecf8e;
–red: #ff5c5c;
–text: #e8e8f0;
–muted: #7070a0;
–russian: #cc4444;
}

body {
font-family: -apple-system, ‘PingFang SC’, sans-serif;
background: var(–bg);
color: var(–text);
min-height: 100vh;
overflow-x: hidden;
}

body::before {
content: ‘’;
position: fixed;
inset: 0;
background-image:
radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 100%),
radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.10) 0%, transparent 100%),
radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,0.08) 0%, transparent 100%),
radial-gradient(1px 1px at 10% 90%, rgba(255,255,255,0.12) 0%, transparent 100%),
radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.09) 0%, transparent 100%);
pointer-events: none;
z-index: 0;
}

.screen { display: none; position: relative; z-index: 1; }
.screen.active { display: flex; }

/* ════ 首页 ════ */
#home {
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
padding: 40px 24px;
gap: 0;
}

.header { text-align: center; margin-bottom: 40px; }

.header-icon {
font-size: 52px;
display: block;
margin-bottom: 14px;
animation: float 3s ease-in-out infinite;
}

@keyframes float {
0%,100% { transform: translateY(0); }
50% { transform: translateY(-8px); }
}

.header h1 {
font-size: 26px;
font-weight: 700;
background: linear-gradient(135deg, var(–gold), #ff9a3c);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

.header p { font-size: 12px; color: var(–muted); margin-top: 6px; letter-spacing: 2px; }

.section-label {
font-size: 10px;
color: var(–muted);
letter-spacing: 2px;
text-transform: uppercase;
margin-bottom: 10px;
padding-left: 2px;
}

/* 语言选择 */
.lang-section { width: 100%; max-width: 360px; margin-bottom: 24px; }

.lang-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.lang-tab {
padding: 16px 12px;
background: var(–card);
border: 1.5px solid var(–border);
border-radius: 14px;
cursor: pointer;
text-align: center;
transition: all 0.2s;
}

.lang-tab.selected.en { border-color: var(–blue); box-shadow: 0 0 16px rgba(74,158,255,0.2); }
.lang-tab.selected.ru { border-color: var(–russian); box-shadow: 0 0 16px rgba(204,68,68,0.2); }

.lang-flag { font-size: 26px; display: block; margin-bottom: 6px; }
.lang-name { font-size: 14px; font-weight: 600; }
.lang-sub { font-size: 11px; color: var(–muted); margin-top: 2px; }

/* 场景选择 */
.mode-section { width: 100%; max-width: 360px; margin-bottom: 28px; }

.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.mode-card {
padding: 16px 12px;
background: var(–card);
border: 1.5px solid var(–border);
border-radius: 14px;
cursor: pointer;
text-align: center;
transition: all 0.2s;
}

.mode-card:hover, .mode-card.selected {
border-color: var(–gold);
box-shadow: 0 0 14px rgba(240,192,64,0.15);
background: linear-gradient(135deg, rgba(240,192,64,0.05), var(–card));
}

.mode-emoji { font-size: 24px; display: block; margin-bottom: 6px; }
.mode-name { font-size: 13px; font-weight: 600; }
.mode-desc { font-size: 10px; color: var(–muted); margin-top: 3px; }

/* 开始按钮 */
.start-btn {
width: 100%;
max-width: 360px;
padding: 17px;
background: linear-gradient(135deg, var(–gold), #ff9a3c);
color: #0f0f1a;
border: none;
border-radius: 16px;
font-size: 16px;
font-weight: 700;
cursor: pointer;
transition: all 0.2s;
}

.start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(240,192,64,0.3); }
.start-btn:active { transform: scale(0.98); }

/* ════ 录音页 ════ */
#recording {
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
padding: 40px 24px;
gap: 20px;
}

.rec-orb {
width: 130px;
height: 130px;
border-radius: 50%;
background: radial-gradient(circle, rgba(62,207,142,0.2) 0%, transparent 70%);
border: 2px solid var(–green);
display: flex;
align-items: center;
justify-content: center;
font-size: 48px;
animation: orb-pulse-en 1.6s ease-in-out infinite;
}

.rec-orb.ru {
background: radial-gradient(circle, rgba(204,68,68,0.2) 0%, transparent 70%);
border-color: var(–russian);
animation: orb-pulse-ru 1.6s ease-in-out infinite;
}

@keyframes orb-pulse-en {
0%,100% { box-shadow: 0 0 0 0 rgba(62,207,142,0.5); }
50% { box-shadow: 0 0 0 22px rgba(62,207,142,0); }
}

@keyframes orb-pulse-ru {
0%,100% { box-shadow: 0 0 0 0 rgba(204,68,68,0.5); }
50% { box-shadow: 0 0 0 22px rgba(204,68,68,0); }
}

.rec-title { font-size: 20px; font-weight: 600; }
.rec-hint { font-size: 13px; color: var(–muted); text-align: center; line-height: 1.7; max-width: 260px; }

.waveform { display: flex; align-items: center; gap: 4px; height: 36px; }

.wave-bar {
width: 4px;
border-radius: 2px;
background: var(–green);
animation: wave 1s ease-in-out infinite;
}

.waveform.ru .wave-bar { background: var(–russian); }

.wave-bar:nth-child(1) { animation-delay: 0s; height: 14px; }
.wave-bar:nth-child(2) { animation-delay: 0.1s; height: 26px; }
.wave-bar:nth-child(3) { animation-delay: 0.2s; height: 34px; }
.wave-bar:nth-child(4) { animation-delay: 0.15s; height: 22px; }
.wave-bar:nth-child(5) { animation-delay: 0.05s; height: 30px; }
.wave-bar:nth-child(6) { animation-delay: 0.25s; height: 18px; }
.wave-bar:nth-child(7) { animation-delay: 0.1s; height: 26px; }

@keyframes wave {
0%,100% { transform: scaleY(0.4); opacity: 0.5; }
50% { transform: scaleY(1); opacity: 1; }
}

.stop-btn {
padding: 14px 44px;
background: transparent;
color: var(–red);
border: 1.5px solid var(–red);
border-radius: 50px;
font-size: 15px;
font-weight: 500;
cursor: pointer;
transition: all 0.2s;
}

.stop-btn:hover { background: rgba(255,92,92,0.1); }

/* ════ 对话页 ════ */
#chat { flex-direction: column; min-height: 100vh; }

.chat-header {
padding: 18px 20px 14px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
background: rgba(26,26,46,0.9);
backdrop-filter: blur(10px);
position: sticky;
top: 0;
z-index: 10;
}

.chat-header-left { display: flex; align-items: center; gap: 8px; }
.chat-title { font-size: 15px; font-weight: 600; }

.mode-badge {
font-size: 11px;
padding: 3px 10px;
border-radius: 20px;
font-weight: 600;
letter-spacing: 0.3px;
}

.mode-badge.en { background: rgba(74,158,255,0.15); color: var(–blue); border: 1px solid rgba(74,158,255,0.3); }
.mode-badge.ru { background: rgba(204,68,68,0.15); color: #ff8080; border: 1px solid rgba(204,68,68,0.3); }

.back-btn {
padding: 7px 14px;
background: var(–card);
border: 1px solid var(–border);
border-radius: 10px;
color: var(–muted);
font-size: 13px;
cursor: pointer;
transition: all 0.2s;
}

.back-btn:hover { color: var(–text); border-color: var(–gold); }

.chat-body {
flex: 1;
padding: 16px;
display: flex;
flex-direction: column;
gap: 12px;
overflow-y: auto;
padding-bottom: 20px;
}

.card {
background: var(–card);
border: 1px solid var(–border);
border-radius: 16px;
padding: 14px 16px;
animation: slideUp 0.3s ease;
}

@keyframes slideUp {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}

.card-label {
font-size: 10px;
letter-spacing: 2px;
text-transform: uppercase;
margin-bottom: 8px;
font-weight: 600;
display: flex;
align-items: center;
gap: 5px;
}

.label-you { color: var(–muted); }
.label-ai-en { color: var(–blue); }
.label-ai-ru { color: #ff8080; }
.label-zh { color: var(–green); }

.card-content { font-size: 15px; line-height: 1.7; color: var(–text); }
.card-content.loading { color: var(–muted); font-style: italic; font-size: 13px; }

.speak-row {
display: flex;
gap: 8px;
margin-top: 10px;
padding-top: 10px;
border-top: 1px solid var(–border);
flex-wrap: wrap;
}

.speak-btn {
display: flex;
align-items: center;
gap: 5px;
padding: 6px 13px;
border-radius: 20px;
border: none;
cursor: pointer;
font-size: 12px;
font-weight: 500;
transition: all 0.2s;
}

.speak-btn.en { background: rgba(74,158,255,0.12); color: var(–blue); border: 1px solid rgba(74,158,255,0.25); }
.speak-btn.ru { background: rgba(204,68,68,0.12); color: #ff8080; border: 1px solid rgba(204,68,68,0.25); }
.speak-btn:hover { opacity: 0.8; transform: scale(1.03); }

/* 跟读卡 */
.follow-card {
border-radius: 16px;
padding: 14px 16px;
animation: slideUp 0.3s ease;
}

.follow-card.en-follow {
background: linear-gradient(135deg, rgba(62,207,142,0.06), var(–card));
border: 1px solid rgba(62,207,142,0.25);
}

.follow-card.ru-follow {
background: linear-gradient(135deg, rgba(204,68,68,0.06), var(–card));
border: 1px solid rgba(204,68,68,0.25);
}

.follow-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
.follow-card.en-follow .follow-title { color: var(–green); }
.follow-card.ru-follow .follow-title { color: #ff9a80; }

.follow-phrase { font-size: 16px; color: var(–text); line-height: 1.6; margin-bottom: 12px; font-weight: 500; }

.follow-btns { display: flex; gap: 8px; flex-wrap: wrap; }

.follow-btn {
padding: 7px 16px;
border-radius: 20px;
border: none;
font-size: 12px;
font-weight: 600;
cursor: pointer;
transition: all 0.2s;
}

.follow-btn.en { background: rgba(74,158,255,0.15); color: var(–blue); border: 1px solid rgba(74,158,255,0.3); }
.follow-btn.ru { background: rgba(204,68,68,0.15); color: #ff8080; border: 1px solid rgba(204,68,68,0.3); }
.follow-btn:hover { opacity: 0.8; transform: scale(1.03); }

/* 底部 */
.chat-footer {
padding: 14px 16px;
border-top: 1px solid var(–border);
background: rgba(15,15,26,0.95);
backdrop-filter: blur(10px);
}

.continue-btn {
width: 100%;
padding: 15px;
background: linear-gradient(135deg, var(–gold), #ff9a3c);
color: #0f0f1a;
border: none;
border-radius: 14px;
font-size: 15px;
font-weight: 700;
cursor: pointer;
transition: all 0.2s;
}

.continue-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(240,192,64,0.25); }
.continue-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

/* 错误提示 */
.toast {
position: fixed;
bottom: 90px;
left: 50%;
transform: translateX(-50%);
background: rgba(255,92,92,0.92);
color: white;
padding: 11px 20px;
border-radius: 12px;
font-size: 13px;
z-index: 999;
display: none;
max-width: 320px;
text-align: center;
white-space: pre-line;
}
</style>

</head>
<body>

<!-- 首页 -->

<div id="home" class="screen active">
  <span class="header-icon">🎓</span>
  <div class="header">
    <h1>AI 口语教练</h1>
    <p>SPEAK · LEARN · GROW</p>
  </div>

  <div class="lang-section">
    <div class="section-label">选择练习语言</div>
    <div class="lang-tabs">
      <div class="lang-tab en selected" onclick="selectLang('en')">
        <span class="lang-flag">🇺🇸</span>
        <div class="lang-name">英语</div>
        <div class="lang-sub">English</div>
      </div>
      <div class="lang-tab ru" onclick="selectLang('ru')">
        <span class="lang-flag">🇷🇺</span>
        <div class="lang-name">俄语</div>
        <div class="lang-sub">Русский</div>
      </div>
    </div>
  </div>

  <div class="mode-section">
    <div class="section-label">选择练习场景</div>
    <div class="mode-grid">
      <div class="mode-card selected" id="mode-daily" onclick="selectMode('daily')">
        <span class="mode-emoji">🌿</span>
        <div class="mode-name">日常对话</div>
        <div class="mode-desc">生活·旅行·聊天</div>
      </div>
      <div class="mode-card" id="mode-work" onclick="selectMode('work')">
        <span class="mode-emoji">💼</span>
        <div class="mode-name">商务职场</div>
        <div class="mode-desc">会议·谈判·邮件</div>
      </div>
      <div class="mode-card" id="mode-travel" onclick="selectMode('travel')">
        <span class="mode-emoji">✈️</span>
        <div class="mode-name">旅行出行</div>
        <div class="mode-desc">问路·酒店·购物</div>
      </div>
      <div class="mode-card" id="mode-social" onclick="selectMode('social')">
        <span class="mode-emoji">🍻</span>
        <div class="mode-name">社交闲聊</div>
        <div class="mode-desc">交友·兴趣·文化</div>
      </div>
    </div>
  </div>

<button class="start-btn" onclick="startSession()">🎙 开始练习</button>

</div>

<!-- 录音页 -->

<div id="recording" class="screen">
  <div class="rec-orb" id="recOrb">🎙</div>
  <div class="rec-title">正在聆听...</div>
  <div class="rec-hint" id="recHint">请开口说话，说完后点击停止</div>
  <div class="waveform" id="waveform">
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>
  <button class="stop-btn" onclick="stopRecording()">⏹ 停止录音</button>
</div>

<!-- 对话页 -->

<div id="chat" class="screen">
  <div class="chat-header">
    <div class="chat-header-left">
      <span class="chat-title" id="chatTitle"></span>
      <span class="mode-badge" id="modeBadge"></span>
    </div>
    <button class="back-btn" onclick="backHome()">← 返回</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-footer">
    <button class="continue-btn" id="continueBtn" onclick="continueSession()" disabled>🎙 继续说话</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 配置 ──
const XFYUN_APPID  = 'ec8d576a';
const XFYUN_APIKEY = 'badcd6a97fc670cd52d7f266ff6aac53';
const XFYUN_SECRET = 'MzVlYTU3M2M5NDVhMjBhZTNjYjg3M2Zh';
const DEEPSEEK_KEY = 'sk-d3ea69c300694d53b8692ec0a6bc4536';

// ── 状态 ──
let currentLang = 'en';
let currentMode = 'daily';
let messages    = [];
let socket      = null;
let audioCtx    = null;
let mediaStream = null;
let processor   = null;
let isRecording = false;
let transcript  = '';

// ── 首页 ──
function selectLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('selected'));
  document.querySelector('.lang-tab.' + lang).classList.add('selected');
}

function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('mode-' + mode).classList.add('selected');
}

// ── 开始会话 ──
function startSession() {
  const sys = {
    en: {
      daily:  "You are a friendly native American English speaker having a real conversation. Reply naturally in 2-3 sentences, use common expressions, and always ask a follow-up question to keep the conversation going.",
      work:   "You are a professional American business English coach. Use formal business vocabulary and idioms. Reply in 2-3 sentences and always ask a relevant follow-up question.",
      travel: "You are a helpful English-speaking local guide. Use practical travel phrases. Reply in 2-3 sentences and always ask a follow-up question.",
      social: "You are a casual American friend. Use informal language, slang, and light humor. Reply in 2-3 sentences and always ask a follow-up question."
    },
    ru: {
      daily:  "Ты дружелюбный носитель русского языка. Отвечай естественно, 2-3 предложениями, используй разговорные выражения и всегда задавай уточняющий вопрос.",
      work:   "Ты профессиональный русскоязычный деловой собеседник. Используй деловую лексику, отвечай 2-3 предложениями и всегда задавай уточняющий вопрос.",
      travel: "Ты русскоязычный гид-помощник. Используй практичные туристические фразы, отвечай 2-3 предложениями и всегда задавай уточняющий вопрос.",
      social: "Ты неформальный русскоязычный друг. Используй разговорный язык и юмор, отвечай 2-3 предложениями и всегда задавай уточняющий вопрос."
    }
  };

  messages = [{ role: 'system', content: sys[currentLang][currentMode] }];

  const modeNames = { daily:'日常对话', work:'商务职场', travel:'旅行出行', social:'社交闲聊' };
  document.getElementById('chatTitle').textContent = modeNames[currentMode];
  const badge = document.getElementById('modeBadge');
  badge.textContent = currentLang === 'en' ? '🇺🇸 英语' : '🇷🇺 俄语';
  badge.className = 'mode-badge ' + currentLang;
  document.getElementById('chatBody').innerHTML = '';
  document.getElementById('continueBtn').disabled = true;

  showScreen('chat');
  setTimeout(startRecording, 300);
}

// ── 录音 ──
function startRecording() {
  showScreen('recording');
  transcript  = '';
  isRecording = true;

  const orb  = document.getElementById('recOrb');
  const hint = document.getElementById('recHint');
  const wf   = document.getElementById('waveform');

  if (currentLang === 'ru') {
    orb.classList.add('ru');
    wf.classList.add('ru');
    hint.textContent = 'Говорите по-русски, затем нажмите стоп';
  } else {
    orb.classList.remove('ru');
    wf.classList.remove('ru');
    hint.textContent = '请用英语说话，说完后点击停止';
  }

  connectXfyun(currentLang === 'ru' ? 'ru_RU' : 'en_US');
}

async function getWsUrl() {
  const host = 'iat-api.xfyun.cn';
  const path = '/v2/iat';
  const date = new Date().toUTCString();
  const origin = `host: ${host}\ndate: ${date}\nGET ${path} HTTP/1.1`;
  const key = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(XFYUN_SECRET),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(origin));
  const signature = btoa(String.fromCharCode(...new Uint8Array(sig)));
  const auth = btoa(`api_key="${XFYUN_APIKEY}", algorithm="hmac-sha256", headers="host date request-line", signature="${signature}"`);
  return `wss://${host}${path}?authorization=${encodeURIComponent(auth)}&date=${encodeURIComponent(date)}&host=${host}`;
}

async function connectXfyun(langCode) {
  try {
    const url = await getWsUrl();
    socket = new WebSocket(url);

    socket.onopen = () => {
      socket.send(JSON.stringify({
        common:   { app_id: XFYUN_APPID },
        business: { language: langCode, domain: 'iat', vad_eos: 3000, dwa: 'wpgs' },
        data:     { status: 0, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' }
      }));
      captureAudio();
    };

    socket.onmessage = (e) => {
      const r = JSON.parse(e.data);
      if (r.data && r.data.result) {
        const ws  = r.data.result.ws || [];
        const seg = ws.map(w => w.cw.map(c => c.w).join('')).join('');
        transcript = r.data.result.pgs === 'rpl' ? seg : transcript + seg;
      }
      if (r.data && r.data.status === 2) finishRecording();
    };

    socket.onerror = () => { showToast('语音识别连接失败，请检查网络'); stopRecording(); };

  } catch(e) {
    showToast('初始化失败: ' + e.message);
    stopRecording();
  }
}

async function captureAudio() {
  try {
    audioCtx    = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioCtx.createMediaStreamSource(mediaStream);

    const workletCode = `
      class PCM extends AudioWorkletProcessor {
        process(inputs) {
          const ch = inputs[0][0];
          if (ch) {
            const pcm = new Int16Array(ch.length);
            for (let i = 0; i < ch.length; i++)
              pcm[i] = Math.max(-32768, Math.min(32767, ch[i] * 32768));
            this.port.postMessage(pcm.buffer, [pcm.buffer]);
          }
          return true;
        }
      }
      registerProcessor('pcm', PCM);
    `;
    const blob = new Blob([workletCode], { type: 'application/javascript' });
    await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));

    processor = new AudioWorkletNode(audioCtx, 'pcm');
    processor.port.onmessage = (e) => {
      if (socket && socket.readyState === WebSocket.OPEN && isRecording) {
        socket.send(JSON.stringify({
          data: { status: 1, format: 'audio/L16;rate=16000', encoding: 'raw',
                  audio: btoa(String.fromCharCode(...new Uint8Array(e.data))) }
        }));
      }
    };
    source.connect(processor);
  } catch(e) {
    showToast('麦克风权限被拒绝，请允许麦克风访问');
    stopRecording();
  }
}

function stopRecording() {
  isRecording = false;
  if (processor)   { processor.disconnect(); processor = null; }
  if (audioCtx)    { audioCtx.close(); audioCtx = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ data: { status: 2, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' } }));
  } else {
    finishRecording();
  }
}

function finishRecording() {
  if (socket) { socket.close(); socket = null; }
  showScreen('chat');
  const text = transcript.trim();
  if (text) {
    addCard('you', null, text);
    sendToAI(text);
  } else {
    showToast('未识别到语音，请重试');
    document.getElementById('continueBtn').disabled = false;
  }
}

// ── AI 对话 ──
async function sendToAI(userText) {
  document.getElementById('continueBtn').disabled = true;
  messages.push({ role: 'user', content: userText });
  if (messages.length > 14) messages.splice(1, 2);

  const aiId = 'card-' + Date.now();
  addCard('ai', aiId, null);

  try {
    const res  = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DEEPSEEK_KEY },
      body: JSON.stringify({ model: 'deepseek-chat', messages })
    });
    const data  = await res.json();
    const reply = data.choices[0].message.content;
    messages.push({ role: 'assistant', content: reply });

    updateAICard(aiId, reply);
    speak(reply, currentLang);
    doTranslate(userText, reply);

  } catch(e) {
    showToast('AI 连接失败，请检查网络');
    document.getElementById('continueBtn').disabled = false;
  }
}

// ── 翻译 ──
async function doTranslate(userText, aiReply) {
  const transId  = 'trans-' + Date.now();
  const followId = 'follow-' + Date.now();
  addTransCard(transId);

  let prompt = '';
  if (currentLang === 'en') {
    prompt = `将以下英语对话翻译成中文，并再提供一遍俄文翻译（Русский）：\n用户：${userText}\nAI：${aiReply}\n\n格式：\n【中文】\n用户：...\nAI：...\n\n【Русский】\nПользователь：...\nИИ：...`;
  } else {
    prompt = `将以下俄语对话翻译成中文：\n用户：${userText}\nAI：${aiReply}\n\n格式：\n用户：...\nAI：...`;
  }

  try {
    const res  = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DEEPSEEK_KEY },
      body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    fillTransCard(transId, data.choices[0].message.content);
  } catch(e) {
    fillTransCard(transId, '翻译加载失败');
  }

  addFollowCard(followId, aiReply);
  document.getElementById('continueBtn').disabled = false;
  scrollBottom();
}

// ── DOM 卡片 ──
function addCard(type, id, text) {
  const body = document.getElementById('chatBody');
  const div  = document.createElement('div');
  div.className = 'card';
  if (id) div.id = id;

  if (type === 'you') {
    div.innerHTML = `
      <div class="card-label label-you">🎙 你说的</div>
      <div class="card-content">${esc(text)}</div>`;
  } else {
    const labelClass = currentLang === 'ru' ? 'label-ai-ru' : 'label-ai-en';
    const flag       = currentLang === 'ru' ? '🇷🇺' : '🇺🇸';
    div.innerHTML = `
      <div class="card-label ${labelClass}">${flag} AI 教练</div>
      <div class="card-content loading" id="${id}-txt">思考中...</div>`;
  }

  body.appendChild(div);
  scrollBottom();
}

function updateAICard(id, text) {
  const card       = document.getElementById(id);
  const labelClass = currentLang === 'ru' ? 'label-ai-ru' : 'label-ai-en';
  const flag       = currentLang === 'ru' ? '🇷🇺' : '🇺🇸';
  const btnClass   = currentLang === 'ru' ? 'ru' : 'en';
  const label      = currentLang === 'ru' ? '俄语朗读' : '英语朗读';

  card.innerHTML = `
    <div class="card-label ${labelClass}">${flag} AI 教练</div>
    <div class="card-content">${esc(text)}</div>
    <div class="speak-row">
      <button class="speak-btn ${btnClass}" onclick="speak('${ea(text)}','${currentLang}')">🔊 ${label}</button>
      <button class="speak-btn ${btnClass}" onclick="speak('${ea(text)}','${currentLang}',0.7)">🐌 慢速</button>
    </div>`;
}

function addTransCard(id) {
  const body = document.getElementById('chatBody');
  const div  = document.createElement('div');
  div.className = 'card';
  div.id = id;
  const label = currentLang === 'ru' ? '📖 中文翻译' : '📖 中文 · 俄文翻译';
  div.innerHTML = `
    <div class="card-label label-zh">${label}</div>
    <div class="card-content loading" id="${id}-txt">翻译中...</div>`;
  body.appendChild(div);
}

function fillTransCard(id, text) {
  const el = document.getElementById(id + '-txt');
  el.className  = 'card-content';
  el.innerHTML  = esc(text).replace(/\n/g, '<br>');
}

function addFollowCard(id, text) {
  const body     = document.getElementById('chatBody');
  const div      = document.createElement('div');
  const isRu     = currentLang === 'ru';
  div.className  = 'follow-card ' + (isRu ? 'ru-follow' : 'en-follow');
  div.id         = id;
  const btnClass = isRu ? 'ru' : 'en';
  const title    = isRu ? '🇷🇺 俄语跟读练习' : '🇺🇸 英语跟读练习';

  div.innerHTML = `
    <div class="follow-title">${title}</div>
    <div class="follow-phrase">${esc(text)}</div>
    <div class="follow-btns">
      <button class="follow-btn ${btnClass}" onclick="speak('${ea(text)}','${currentLang}')">🔊 听示范</button>
      <button class="follow-btn ${btnClass}" onclick="speak('${ea(text)}','${currentLang}',0.7)">🐌 慢速示范</button>
    </div>`;

  body.appendChild(div);
  scrollBottom();
}

// ── 语音合成 ──
function speak(text, lang, rate = 1) {
  speechSynthesis.cancel();
  const u  = new SpeechSynthesisUtterance(text);
  u.lang   = lang === 'ru' ? 'ru-RU' : 'en-US';
  u.rate   = rate;
  const vs = speechSynthesis.getVoices();
  const v  = vs.find(x => x.lang.startsWith(lang === 'ru' ? 'ru' : 'en'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// ── 工具 ──
function continueSession() { startRecording(); }

function backHome() {
  speechSynthesis.cancel();
  stopRecording();
  showScreen('home');
  messages = [];
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
    s.style.display = 'none';
  });
  const el = document.getElementById(id);
  el.style.display = 'flex';
  setTimeout(() => el.classList.add('active'), 10);
}

function scrollBottom() {
  const b = document.getElementById('chatBody');
  setTimeout(() => b.scrollTop = b.scrollHeight, 120);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3500);
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function ea(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
}

// 预加载声音
window.addEventListener('load', () => {
  speechSynthesis.getVoices();
  setTimeout(() => speechSynthesis.getVoices(), 600);
});
</script>
